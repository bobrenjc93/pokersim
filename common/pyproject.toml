[project]
name = "pokersim-common"
version = "0.1.0"
description = "Common utilities for Poker AI training and evaluation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common"]
package-dir = {"common" = "."}

