[project]
name = "pokersim-elo"
version = "0.1.1"
description = "ELO rating simulation system for Poker AI models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pokersim-common",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "flask>=3.0.0",
]

[project.scripts]
poker-elo = "server:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["engine", "server"]

[tool.uv.sources]
pokersim-common = { path = "../common" }
